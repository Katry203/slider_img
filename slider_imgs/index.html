<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap-grid.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"

    <link rel="stylesheet" href="./css/styly.css" />
  </head>
  <body>
    <div class="slider_imges">
      <div class="slider_number" id="slider_number"></div>
      <img

      />

      <img src="./assets/imges/imgs03.jpg" alt="3" />
      <img src="./assets/imges/imgs04.jpg" alt="4" />
      <img src="./assets/imges/imgs05.jpg" alt="5" />
    </div>
    <div class="slides_controls">
      <span class="prev" id="prev">Previous</span>
      <span class="indicators" id="indicators"></span>
      <span id="next" class="next">Next</span>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.min.js"></script>
    <script src="./JS/index.Js"></script>
